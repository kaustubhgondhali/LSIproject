<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Your Receipt | Lord Sai Investment &amp; Share Market Academy</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: "Inter", sans-serif; background: #F5F7FA; color: #0F172A; min-height: 100vh; }
        .rc-wrap { max-width: 560px; margin: 0 auto; padding: 36px 16px 48px; }
        .rc-logo { display: block; width: 240px; max-width: 78%; margin: 0 auto 22px; }
        .rc-card { background: #fff; border: 1px solid #E5E9F0; border-radius: 16px; box-shadow: 0 10px 30px rgba(15, 23, 42, .06); padding: 26px; }
        .rc-card h1 { font-size: 20px; font-weight: 800; margin: 0 0 4px; color: #1B2A47; }
        .rc-sub { color: #64748B; font-size: 13.5px; margin-bottom: 18px; }
        .rc-table th { color: #64748B; font-weight: 500; width: 42%; font-size: 13px; }
        .rc-table td { font-weight: 600; font-size: 14px; word-break: break-word; }
        .rc-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 13px 16px; border-radius: 30px; font-weight: 700; font-size: 15px; text-decoration: none; }
        .rc-btn.primary { background: #0B5FA5; color: #fff; }
        .rc-btn.primary:hover { background: #094d86; color: #fff; }
        .rc-btn.light { background: #EEF4FB; color: #0B5FA5; margin-top: 10px; }
        .rc-msg { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 12px; font-size: 14px; }
        .rc-msg.bad { background: #FEE2E2; color: #B91C1C; }
        .rc-msg i { font-size: 22px; margin-top: 2px; }
        .rc-foot { text-align: center; color: #94A3B8; font-size: 12px; margin-top: 18px; line-height: 1.6; }
        .rc-foot a { color: #0B638F; }
    </style>
    <script src="js/api-config.js"></script>
</head>
<body>
    <!-- Opened from the private link in a WhatsApp message from the academy. The link itself is the
         permission (signed, expires after 30 days); no login is needed and nothing is stored here. -->
    <div class="rc-wrap">
        <img src="img/lord-sai-logo.png" alt="Lord Sai Investment &amp; Share Market Academy" class="rc-logo">
        <div class="rc-card">
            <div id="rcBody"><div class="text-muted"><span class="spinner-border spinner-border-sm me-2"></span>Opening your document…</div></div>
        </div>
        <div class="rc-foot">
            Lord Sai Investment &amp; Share Market Academy, Uran, Navi Mumbai<br>
            Questions? Call <a href="tel:+919920254354">9920254354</a> or email <a href="mailto:lordsai.academy@gmail.com">lordsai.academy@gmail.com</a>
        </div>
    </div>
    <script>
        (function () {
            "use strict";
            var body = document.getElementById("rcBody");
            var api = (window.LSI_CONFIG && window.LSI_CONFIG.API_BASE) || "/api";
            var token = new URLSearchParams(window.location.search).get("t") || "";
            function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
            function date(iso) {
                if (!iso) return "";
                var d = new Date(iso + "T00:00:00");
                return isNaN(d) ? esc(iso) : d.toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });
            }
            function fail(message) {
                body.innerHTML = '<div class="rc-msg bad"><i class="fas fa-exclamation-circle"></i><div><strong>The document could not be opened.</strong><br>' + esc(message) + '</div></div>';
            }
            if (!/^[A-Za-z0-9._-]{10,}$/.test(token)) { fail("This link is not valid. Please make sure the whole link was opened."); return; }
            var file = api + "/public/documents/" + encodeURIComponent(token);
            fetch(file + "/info").then(function (r) {
                return r.json().catch(function () { return {}; }).then(function (res) { return { ok: r.ok, res: res }; });
            }).then(function (x) {
                if (!x.ok || !x.res || !x.res.success) { fail((x.res && x.res.message) || "Please try again later."); return; }
                var d = x.res.data;
                var noun = d.kind === "RECEIPT" ? "payment receipt" : d.kind === "INVOICE" ? "invoice" : "document";
                document.title = d.title + (d.number ? " " + d.number : "") + " | Lord Sai";
                body.innerHTML =
                    '<h1><i class="fas fa-file-invoice me-2" style="color:#0B5FA5"></i>Your ' + esc(noun) + '</h1>' +
                    '<div class="rc-sub">Sent to you by Lord Sai Investment &amp; Share Market Academy.</div>' +
                    '<table class="table table-sm rc-table mb-3">' +
                    '<tr><th>Document</th><td>' + esc(d.title) + '</td></tr>' +
                    (d.number ? '<tr><th>' + (d.kind === "INVOICE" ? "Invoice No." : "Receipt No.") + '</th><td>' + esc(d.number) + '</td></tr>' : "") +
                    (d.date ? '<tr><th>Date</th><td>' + date(d.date) + '</td></tr>' : "") +
                    '<tr><th>Link valid until</th><td>' + date(d.expiresOn) + '</td></tr></table>' +
                    '<a class="rc-btn primary" href="' + esc(file) + '" target="_blank" rel="noopener"><i class="fas fa-eye"></i> View ' + esc(noun) + ' (PDF)</a>' +
                    '<a class="rc-btn light" href="' + esc(file + "?download=true") + '"><i class="fas fa-download"></i> Download PDF</a>';
            }).catch(function () { fail("Cannot reach the academy's website right now. Please check your internet connection and try again."); });
        })();
    </script>
</body>
</html>
