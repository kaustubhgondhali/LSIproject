<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Mentor Dashboard | Lord Sai Investment & Share Market Academy</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
</head>
<body class="bg-light">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="js/auth.js"></script>
    <script>LSI_Auth.requireAuth('teacher');</script>
    
    <div class="container py-5">
        <div class="card p-5 border-0 shadow-sm bg-white" style="border-radius: 16px;">
            <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">

                <div>

                </div>
            </div>
            <div class="alert alert-success">
                <i class="fas fa-check-circle me-1"></i> You are logged in with Faculty / Teacher Role.
            </div>
            <div class="row g-3">
                <div class="col-md-4"><div class="p-3 bg-light rounded border"><strong>Active Batches:</strong> Uran 2024, Navi Mumbai Evening, Weekend Executive</div></div>
                <div class="col-md-4"><div class="p-3 bg-light rounded border"><strong>Total Learners:</strong> 128 Active Students</div></div>
                <div class="col-md-4"><div class="p-3 bg-light rounded border"><strong>Next Session:</strong> Saturday 10:00 AM</div></div>
            </div>
        </div>
    </div>
    <!-- Multilingual Engine -->
    <script src="js/translations.js"></script>
