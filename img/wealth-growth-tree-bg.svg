<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%">
  <defs>
    <!-- Emerald & Teal Gradients -->
    <linearGradient id="trunkGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D5C46" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#1F8A70" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2EC4B6" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="branchGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1F8A70" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#48E5C2" stop-opacity="0.75"/>
    </linearGradient>

    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48E5C2" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1F8A70" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="leafGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2EC4B6" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#57CC99" stop-opacity="0.55"/>
    </linearGradient>

    <!-- Muted Champagne Gold Gradients for Wealth Coins -->
    <linearGradient id="goldCoinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#EAB308" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#CA8A04" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="goldCoinInner" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CA8A04" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FEF08A" stop-opacity="0.95"/>
    </linearGradient>

    <radialGradient id="softGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2EC4B6" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#1F8A70" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0A3622" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EAB308" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#EAB308" stop-opacity="0"/>
    </radialGradient>

    <!-- Coin Filter Drop Shadows -->
    <filter id="coinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ambient Glow Canopy -->
  <circle cx="250" cy="280" r="220" fill="url(#softGlow)"/>
  <circle cx="250" cy="560" r="160" fill="url(#goldGlow)"/>

  <!-- Compounding Exponential Trend Curve (Behind Tree) -->
  <path d="M 40 620 Q 180 610 260 480 T 440 120" fill="none" stroke="url(#branchGrad)" stroke-width="2.5" stroke-dasharray="6,6" opacity="0.45"/>

  <!-- Base: Compounding Coin Stacks / Wealth Reservoir -->
  <g filter="url(#coinShadow)" opacity="0.9">
    <!-- Layer 1 Coins (Bottom Foundation) -->
    <ellipse cx="190" cy="635" rx="48" ry="16" fill="url(#goldCoinGrad)"/>
    <ellipse cx="190" cy="630" rx="44" ry="13" fill="url(#goldCoinInner)" stroke="#FEF08A" stroke-width="1.2"/>

    <ellipse cx="310" cy="635" rx="48" ry="16" fill="url(#goldCoinGrad)"/>
    <ellipse cx="310" cy="630" rx="44" ry="13" fill="url(#goldCoinInner)" stroke="#FEF08A" stroke-width="1.2"/>

    <ellipse cx="250" cy="642" rx="60" ry="18" fill="url(#goldCoinGrad)"/>
    <ellipse cx="250" cy="636" rx="55" ry="15" fill="url(#goldCoinInner)" stroke="#FEF08A" stroke-width="1.5"/>
    <text x="250" y="641" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#78350F" text-anchor="middle" opacity="0.85">&#8377;</text>

    <!-- Layer 2 Coins -->
    <ellipse cx="215" cy="612" rx="46" ry="15" fill="url(#goldCoinGrad)"/>
    <ellipse cx="215" cy="607" rx="42" ry="12" fill="url(#goldCoinInner)" stroke="#FEF08A" stroke-width="1.2"/>

    <ellipse cx="285" cy="612" rx="46" ry="15" fill="url(#goldCoinGrad)"/>
    <ellipse cx="285" cy="607" rx="42" ry="12" fill="url(#goldCoinInner)" stroke="#FEF08A" stroke-width="1.2"/>

    <!-- Layer 3 Coins (Top pedestal) -->
    <ellipse cx="250" cy="588" rx="50" ry="16" fill="url(#goldCoinGrad)"/>
    <ellipse cx="250" cy="582" rx="46" ry="13" fill="url(#goldCoinInner)" stroke="#FEF08A" stroke-width="1.2"/>
    <text x="250" y="587" font-family="Inter, sans-serif" font-size="13" font-weight="bold" fill="#78350F" text-anchor="middle" opacity="0.85">&#8377;</text>
  </g>

  <!-- Tree Trunk Roots Emerging from Coins -->
  <g opacity="0.95">
    <!-- Roots anchored in wealth base -->
    <path d="M 232 585 C 220 595 200 610 190 625" fill="none" stroke="url(#trunkGrad)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 268 585 C 280 595 300 610 310 625" fill="none" stroke="url(#trunkGrad)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 250 580 C 250 595 250 610 250 628" fill="none" stroke="url(#trunkGrad)" stroke-width="7" stroke-linecap="round"/>

    <!-- Main Trunk -->
    <path d="M 236 580 C 238 520 234 450 240 380 C 242 350 245 320 250 290 C 255 320 258 350 260 380 C 266 450 262 520 264 580 Z" fill="url(#trunkGrad)"/>

    <!-- Trunk Core Texture Rings / Compounding growth rings -->
    <path d="M 244 540 Q 250 535 256 540" fill="none" stroke="#48E5C2" stroke-width="1.5" opacity="0.4"/>
    <path d="M 243 490 Q 250 484 257 490" fill="none" stroke="#48E5C2" stroke-width="1.5" opacity="0.4"/>
    <path d="M 244 440 Q 250 434 256 440" fill="none" stroke="#48E5C2" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Primary Branch Architecture (Reaching Outward and Upward) -->
  <g fill="none" stroke-linecap="round" opacity="0.9">
    <!-- Lower Left Major Branch -->
    <path d="M 243 450 C 215 440 170 435 130 405 C 110 390 95 365 80 340" stroke="url(#trunkGrad)" stroke-width="9"/>
    <path d="M 145 418 C 135 390 120 370 100 350" stroke="url(#branchGrad)" stroke-width="5"/>
    <path d="M 165 428 C 160 405 165 385 175 365" stroke="url(#branchGrad)" stroke-width="4.5"/>
    <path d="M 105 375 C 85 370 70 355 55 335" stroke="url(#branchGrad)" stroke-width="3.5"/>

    <!-- Lower Right Major Branch -->
    <path d="M 257 450 C 285 440 330 435 370 405 C 390 390 405 365 420 340" stroke="url(#trunkGrad)" stroke-width="9"/>
    <path d="M 355 418 C 365 390 380 370 400 350" stroke="url(#branchGrad)" stroke-width="5"/>
    <path d="M 335 428 C 340 405 335 385 325 365" stroke="url(#branchGrad)" stroke-width="4.5"/>
    <path d="M 395 375 C 415 370 430 355 445 335" stroke="url(#branchGrad)" stroke-width="3.5"/>

    <!-- Mid Left Branch -->
    <path d="M 246 360 C 215 340 180 310 145 270 C 130 250 120 225 110 195" stroke="url(#trunkGrad)" stroke-width="7"/>
    <path d="M 185 315 C 175 285 160 260 140 235" stroke="url(#branchGrad)" stroke-width="4"/>
    <path d="M 155 280 C 145 255 145 235 150 215" stroke="url(#branchGrad)" stroke-width="3.5"/>

    <!-- Mid Right Branch (Upward Compounding Arc) -->
    <path d="M 254 360 C 285 340 320 310 355 270 C 370 250 380 225 390 195" stroke="url(#trunkGrad)" stroke-width="7"/>
    <path d="M 315 315 C 325 285 340 260 360 235" stroke="url(#branchGrad)" stroke-width="4"/>
    <path d="M 345 280 C 355 255 355 235 350 215" stroke="url(#branchGrad)" stroke-width="3.5"/>

    <!-- Crown / Top Canopy Branches -->
    <path d="M 248 300 C 235 250 215 200 185 155 C 170 135 155 115 140 95" stroke="url(#trunkGrad)" stroke-width="6"/>
    <path d="M 252 300 C 265 250 285 200 315 155 C 330 135 345 115 360 95" stroke="url(#trunkGrad)" stroke-width="6"/>
    <path d="M 250 290 C 250 230 250 170 250 110" stroke="url(#trunkGrad)" stroke-width="5.5"/>
    <path d="M 250 210 C 235 180 220 150 205 120" stroke="url(#branchGrad)" stroke-width="3.5"/>
    <path d="M 250 210 C 265 180 280 150 295 120" stroke="url(#branchGrad)" stroke-width="3.5"/>
  </g>

  <!-- Foliage Canopy Clustered Clouds / Emerald Leaves -->
  <g opacity="0.65">
    <circle cx="120" cy="380" r="38" fill="url(#leafGrad1)"/>
    <circle cx="80" cy="340" r="34" fill="url(#leafGrad2)"/>
    <circle cx="55" cy="330" r="26" fill="url(#leafGrad1)"/>

    <circle cx="380" cy="380" r="38" fill="url(#leafGrad1)"/>
    <circle cx="420" cy="340" r="34" fill="url(#leafGrad2)"/>
    <circle cx="445" cy="330" r="26" fill="url(#leafGrad1)"/>

    <circle cx="140" cy="265" r="42" fill="url(#leafGrad2)"/>
    <circle cx="105" cy="205" r="35" fill="url(#leafGrad1)"/>

    <circle cx="360" cy="265" r="42" fill="url(#leafGrad2)"/>
    <circle cx="395" cy="205" r="35" fill="url(#leafGrad1)"/>

    <circle cx="185" cy="150" r="44" fill="url(#leafGrad1)"/>
    <circle cx="140" cy="100" r="36" fill="url(#leafGrad2)"/>

    <circle cx="315" cy="150" r="44" fill="url(#leafGrad1)"/>
    <circle cx="360" cy="100" r="36" fill="url(#leafGrad2)"/>

    <circle cx="250" cy="110" r="48" fill="url(#leafGrad2)"/>
    <circle cx="250" cy="70" r="36" fill="url(#leafGrad1)"/>
  </g>

  <!-- Golden Wealth Coins / Compounding Yield Fruit on Tree -->
  <g filter="url(#coinShadow)" opacity="0.95">
    <!-- Coin 1 (Apex Summit) -->
    <circle cx="250" cy="65" r="22" fill="url(#goldCoinGrad)"/>
    <circle cx="250" cy="65" r="18" fill="url(#goldCoinInner)" stroke="#FEF08A" stroke-width="1.2"/>
    <text x="250" y="71" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#78350F" text-anchor="middle">&#8377;</text>

    <!-- Coin 2 (Top Left) -->
    <circle cx="140" cy="95" r="19" fill="url(#goldCoinGrad)"/>
    <circle cx="140" cy="95" r="15" fill="url(#goldCoinInner)" stroke="#FEF08A" stroke-width="1"/>
    <text x="140" y="100" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#78350F" text-anchor="middle">&#8377;</text>

    <!-- Coin 3 (Top Right) -->
    <circle cx="360" cy="95" r="19" fill="url(#goldCoinGrad)"/>
    <circle cx="360" cy="95" r="15" fill="url(#goldCoinInner)" stroke="#FEF08A" stroke-width="1"/>
    <text x="360" y="100" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#78350F" text-anchor="middle">&#8377;</text>

    <!-- Coin 4 (Upper Left Branch) -->
    <circle cx="105" cy="195" r="18" fill="url(#goldCoinGrad)"/>
    <circle cx="105" cy="195" r="14" fill="url(#goldCoinInner)" stroke="#FEF08A" stroke-width="1"/>
    <text x="105" y="200" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#78350F" text-anchor="middle">&#8377;</text>

    <!-- Coin 5 (Upper Right Branch) -->
    <circle cx="395" cy="195" r="18" fill="url(#goldCoinGrad)"/>
    <circle cx="395" cy="195" r="14" fill="url(#goldCoinInner)" stroke="#FEF08A" stroke-width="1"/>
    <text x="395" y="200" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#78350F" text-anchor="middle">&#8377;</text>

    <!-- Coin 6 (Mid Left Canopy) -->
    <circle cx="185" cy="225" r="17" fill="url(#goldCoinGrad)"/>
    <circle cx="185" cy="225" r="13" fill="url(#goldCoinInner)" stroke="#FEF08A" stroke-width="1"/>
    <text x="185" y="229" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#78350F" text-anchor="middle">&#8377;</text>

    <!-- Coin 7 (Mid Right Canopy) -->
    <circle cx="315" cy="225" r="17" fill="url(#goldCoinGrad)"/>
    <circle cx="315" cy="225" r="13" fill="url(#goldCoinInner)" stroke="#FEF08A" stroke-width="1"/>
    <text x="315" y="229" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#78350F" text-anchor="middle">&#8377;</text>

    <!-- Coin 8 (Lower Outer Left) -->
    <circle cx="55" cy="330" r="16" fill="url(#goldCoinGrad)"/>
    <circle cx="55" cy="330" r="12" fill="url(#goldCoinInner)" stroke="#FEF08A" stroke-width="1"/>
    <text x="55" y="334" font-family="Inter, sans-serif" font-size="10" font-weight="bold" fill="#78350F" text-anchor="middle">&#8377;</text>

    <!-- Coin 9 (Lower Outer Right) -->
    <circle cx="445" cy="330" r="16" fill="url(#goldCoinGrad)"/>
    <circle cx="445" cy="330" r="12" fill="url(#goldCoinInner)" stroke="#FEF08A" stroke-width="1"/>
    <text x="445" y="334" font-family="Inter, sans-serif" font-size="10" font-weight="bold" fill="#78350F" text-anchor="middle">&#8377;</text>
  </g>

  <!-- Ambient Floating Golden Growth Seeds / Compounding SIP Particles -->
  <g opacity="0.75">
    <circle cx="210" cy="120" r="4" fill="#FEF08A"/>
    <circle cx="290" cy="120" r="3.5" fill="#FEF08A"/>
    <circle cx="160" cy="180" r="3" fill="#FDE047"/>
    <circle cx="340" cy="180" r="3" fill="#FDE047"/>
    <circle cx="110" cy="290" r="3.5" fill="#48E5C2"/>
    <circle cx="390" cy="290" r="3.5" fill="#48E5C2"/>
    <circle cx="230" cy="260" r="2.5" fill="#FEF08A"/>
    <circle cx="270" cy="260" r="2.5" fill="#FEF08A"/>
  </g>
</svg>