<!DOCTYPE html>
<!--
  Branded PDF for every tabular export (Automation Admin reports, purchase reports, invoices list,
  communication history). Well-formed XHTML: rendered by PdfRenderer. Page numbers come from the
  CSS paged-media counters in the footer.
-->
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${title}">Report</title>
    <style>
        @page { size: A4 landscape; margin: 14mm 12mm 16mm 12mm;
            @bottom-left { content: "Lord Sai Share Market Classes"; font-family: 'Noto Sans'; font-size: 8pt; color: #64748b; }
            @bottom-right { content: "Page " counter(page) " of " counter(pages); font-family: 'Noto Sans'; font-size: 8pt; color: #64748b; } }
        body { font-family: 'Noto Sans', Arial, sans-serif; font-size: 8.5pt; color: #0f172a; margin: 0; }
        .head { width: 100%; border-collapse: collapse; border-bottom: 3px solid #0B5FA5; padding-bottom: 6px; }
        .head td { vertical-align: middle; padding: 0 0 6px 0; }
        .logo { height: 42px; }
        .title { font-size: 15pt; font-weight: 700; color: #0A1128; text-align: right; }
        .meta { font-size: 8pt; color: #475569; text-align: right; margin-top: 2px; }
        .filters { margin: 8px 0 10px; padding: 6px 10px; background: #f0f6fc; border-left: 4px solid #0B5FA5; font-size: 8pt; color: #1e3a8a; }
        .filters span { display: inline-block; margin-right: 12px; }
        table.data { width: 100%; border-collapse: collapse; }
        table.data thead { display: table-header-group; }
        table.data th { background: #0B5FA5; color: #fff; text-align: left; padding: 5px 6px; font-size: 7.8pt; text-transform: uppercase; letter-spacing: .4px; }
        table.data td { padding: 4px 6px; border-bottom: 1px solid #e2e8f0; font-size: 8pt; vertical-align: top; }
        table.data tr:nth-child(even) td { background: #f8fafc; }
        table.data td.num { text-align: right; white-space: nowrap; }
        .totals { margin-top: 8px; font-size: 8pt; color: #0A1128; }
        .totals span { display: inline-block; margin-right: 14px; }
        .empty { padding: 16px; color: #64748b; text-align: center; }
    </style>
</head>
<body>
<table class="head">
    <tr>
        <td style="width:40%;"><img th:src="${logoDataUri}" alt="Lord Sai" class="logo"/></td>
        <td style="width:60%;">
            <div class="title" th:text="${title}">Report</div>
            <div class="meta">Generated <span th:text="${generatedAt}">date</span> · <span th:text="${recordCount} + ' record(s)'">0 record(s)</span></div>
        </td>
    </tr>
</table>
<div class="filters">
    <strong>Applied filters:</strong>
    <span th:if="${#maps.isEmpty(filters)}">none</span>
    <span th:each="f : ${filters}"><strong th:text="${f.key} + ':'">k</strong> <span th:text="${f.value}">v</span></span>
</div>
<table class="data">
    <thead>
    <tr><th th:each="c : ${columns}" th:text="${c}">Column</th></tr>
    </thead>
    <tbody>
    <tr th:each="row : ${rows}">
        <td th:each="cell : ${row}" th:classappend="${cell instanceof T(java.lang.Number)} ? 'num' : ''" th:text="${cell}">value</td>
    </tr>
    </tbody>
</table>
<div class="empty" th:if="${#lists.isEmpty(rows)}">No records match the applied filters.</div>
<div class="totals" th:if="${!#maps.isEmpty(totals)}">
    <strong>Totals:</strong>
    <span th:each="t : ${totals}"><span th:text="${t.key}">k</span>: <strong th:text="${t.value}">v</strong></span>
</div>
</body>
</html>
