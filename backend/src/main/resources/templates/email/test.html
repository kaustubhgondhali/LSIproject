<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<div th:replace="~{email/layout :: wrapper('Test email', ~{::content})}">
    <div th:fragment="content">
        <p style="margin:0 0 14px;font-size:15px;line-height:1.6;">Hello,</p>
        <p style="margin:0 0 14px;font-size:15px;line-height:1.6;">
            This is a test email from the LSI VITC administration system.
        </p>
        <p style="margin:0 0 18px;font-size:15px;line-height:1.6;color:#0f9f90;font-weight:700;">
            Your email configuration is working correctly.
        </p>
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;margin:0 0 22px;">
            <tr><td style="padding:12px 18px;font-size:13px;line-height:1.8;color:#334155;">
                <div><span style="color:#64748b;">Requested by:</span> <span th:text="${requestedBy}">admin</span></div>
                <div><span style="color:#64748b;">SMTP source:</span> <span th:text="${source == 'ADMIN'} ? 'Email Settings (admin panel)' : 'Server environment'">Email Settings</span></div>
            </td></tr>
        </table>
        <p style="margin:0;font-size:14px;line-height:1.6;color:#334155;">
            Regards,<br>LSI VITC Administration
        </p>
    </div>
</div>
</body>
</html>
