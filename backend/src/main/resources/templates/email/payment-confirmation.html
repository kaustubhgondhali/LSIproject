<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<div th:replace="~{email/layout :: wrapper('Payment received', ~{::content})}">
    <div th:fragment="content">
        <p style="margin:0 0 14px;font-size:15px;line-height:1.6;">Dear <strong th:text="${name}">Customer</strong>,</p>
        <p style="margin:0 0 18px;font-size:15px;line-height:1.6;">Thank you. We have received your payment.</p>
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;margin:0 0 22px;">
            <tr><td style="padding:14px 18px;font-size:14px;line-height:1.8;">
                <div><span style="color:#64748b;">Course:</span> <strong th:text="${courseName}">Course</strong></div>
                <div><span style="color:#64748b;">Order reference:</span> <span th:text="${orderRef}">LSI-ORD</span></div>
                <div><span style="color:#64748b;">Amount:</span> <span th:text="${amount}">₹</span></div>
            </td></tr>
        </table>
        <p style="margin:0;font-size:14px;line-height:1.6;color:#334155;">Keep this email for your records.</p>
    </div>
</div>
</body>
</html>
