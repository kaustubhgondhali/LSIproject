<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<!-- Admin-composed message (individual or bulk communication). The message is plain text; line breaks are preserved. -->
<body>
<div th:replace="~{email/layout :: wrapper(${subject}, ~{::content})}">
    <div th:fragment="content">
        <p style="margin:0 0 14px;font-size:15px;line-height:1.6;">Dear <strong th:text="${name}">Student</strong>,</p>
        <div style="margin:0 0 18px;font-size:15px;line-height:1.7;color:#0f172a;white-space:pre-wrap;" th:text="${message}">Message</div>
        <p style="margin:0 0 16px;text-align:center;">
            <a th:href="${portalUrl}" style="display:inline-block;background:#0B5FA5;color:#ffffff;text-decoration:none;font-weight:700;padding:12px 26px;border-radius:30px;font-size:14px;">Open Student Portal</a>
        </p>
        <p style="margin:0;font-size:12px;line-height:1.6;color:#64748b;">
            Sent by Lord Sai Investment &amp; Share Market Academy. Reply to this email or contact
            <a th:href="'mailto:' + ${supportEmail}" th:text="${supportEmail}" style="color:#0B5FA5;">support</a> for any query.
        </p>
    </div>
</div>
</body>
</html>
