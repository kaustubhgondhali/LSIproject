<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<div th:replace="~{email/layout :: wrapper('Password changed successfully', ~{::content})}">
    <div th:fragment="content">
        <p style="margin:0 0 14px;font-size:15px;line-height:1.6;">Hello <strong th:text="${name}">User</strong>,</p>
        <p style="margin:0 0 18px;font-size:15px;line-height:1.6;">
            Your LSI VITC account password was successfully changed.
        </p>
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;margin:0 0 22px;">
            <tr><td style="padding:12px 18px;font-size:14px;line-height:1.6;color:#9a3412;">
                <strong>If you did not perform this action, please contact the administrator immediately.</strong>
            </td></tr>
        </table>
        <p style="margin:0 0 22px;text-align:center;">
            <a th:href="${loginUrl}" style="display:inline-block;background:#0f9f90;color:#ffffff;text-decoration:none;font-weight:700;padding:13px 28px;border-radius:30px;font-size:15px;">Sign in</a>
        </p>
        <p style="margin:0;font-size:14px;line-height:1.6;color:#334155;">
            Regards,<br>LSI VITC Administration
        </p>
    </div>
</div>
</body>
</html>
