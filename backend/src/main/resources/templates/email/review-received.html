<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<div th:replace="~{email/layout :: wrapper('We received your review', ~{::content})}">
    <div th:fragment="content">
        <p style="margin:0 0 14px;font-size:15px;line-height:1.6;">Dear <strong th:text="${name}">Visitor</strong>,</p>
        <p style="margin:0 0 14px;font-size:15px;line-height:1.6;">Thank you for sharing your experience with us.</p>
        <p style="margin:0 0 14px;font-size:15px;line-height:1.6;">Your review has been received. It is currently awaiting approval by our team and will appear on our website once it has been reviewed.</p>
        <p style="margin:0;font-size:14px;line-height:1.6;color:#334155;">No action is needed from your side.</p>
    </div>
</div>
</body>
</html>
