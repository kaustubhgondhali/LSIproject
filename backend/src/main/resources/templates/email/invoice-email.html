<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<!-- Invoice (re)send from the admin panels: the PDF is attached; no credentials are included. -->
<body>
<div th:replace="~{email/layout :: wrapper('Your Invoice from Lord Sai Academy', ~{::content})}">
    <div th:fragment="content">
        <p style="margin:0 0 14px;font-size:15px;line-height:1.6;">Dear <strong th:text="${name}">Student</strong>,</p>
        <p style="margin:0 0 18px;font-size:15px;line-height:1.6;">
            Please find attached invoice <strong style="font-family:monospace;color:#0B5FA5;" th:text="${invoiceNumber}">LSI-INV</strong>
            for your purchase of <strong th:text="${productName}">product</strong>.
        </p>

        <div th:replace="~{email/purchase-fragments :: summary}"></div>

        <p style="margin:0 0 16px;text-align:center;">
            <a th:href="${portalUrl}" style="display:inline-block;background:#0B5FA5;color:#ffffff;text-decoration:none;font-weight:700;padding:12px 26px;border-radius:30px;font-size:14px;">Open Student Portal</a>
        </p>
        <p style="margin:0;font-size:13px;line-height:1.6;color:#334155;">
            All your invoices are also available under <em>My Invoices</em> after you log in to the Student Portal.
            Questions? <a th:href="'mailto:' + ${supportEmail}" th:text="${supportEmail}" style="color:#0B5FA5;">support</a>
            · <span th:text="${supportPhone}">phone</span>
        </p>
    </div>
</div>
</body>
</html>
