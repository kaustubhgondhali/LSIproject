<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<!-- Sent once after a VERIFIED course payment (new student account). Lord Sai blue branding. -->
<body>
<div th:replace="~{email/layout :: wrapper('Course Purchase Confirmed', ~{::content})}">
    <div th:fragment="content">
        <p style="margin:0 0 14px;font-size:15px;line-height:1.6;">Dear <strong th:text="${name}">Student</strong>,</p>
        <p style="margin:0 0 18px;font-size:15px;line-height:1.6;">
            Thank you for your purchase. Your payment has been verified and
            <strong th:text="${productName}">the course</strong> is now active on your Lord Sai Student Portal account.
        </p>

        <div th:replace="~{email/purchase-fragments :: summary}"></div>
        <div th:replace="~{email/purchase-fragments :: credentials}"></div>
        <div th:replace="~{email/purchase-fragments :: access('Your purchased course is available only through the official Lord Sai Student Portal after login. Direct access to protected course content is not permitted.')}"></div>

        <p style="margin:18px 0 0;font-size:14px;line-height:1.6;color:#334155;">
            Inside the portal you will find your modules, lesson videos, handouts, the trade journal and the doubt desk.
            Happy learning!
        </p>
    </div>
</div>
</body>
</html>
