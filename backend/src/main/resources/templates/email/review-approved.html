<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<div th:replace="~{email/layout :: wrapper('Your review is now live', ~{::content})}">
    <div th:fragment="content">
        <p style="margin:0 0 14px;font-size:15px;line-height:1.6;">Dear <strong th:text="${name}">Visitor</strong>,</p>
        <p style="margin:0 0 18px;font-size:15px;line-height:1.6;">Good news — your review has been approved and is now visible on our website.</p>
        <p style="margin:0 0 22px;text-align:center;">
            <a th:href="${testimonialsUrl}" style="display:inline-block;background:#0f9f90;color:#ffffff;text-decoration:none;font-weight:700;padding:13px 28px;border-radius:30px;font-size:15px;">See it on our website</a>
        </p>
        <p style="margin:0;font-size:14px;line-height:1.6;color:#334155;">Thank you for helping other learners make an informed choice.</p>
    </div>
</div>
</body>
</html>
